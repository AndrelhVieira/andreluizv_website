name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      # The site imports types from .contentlayer/generated, which only exists after a build
      - name: Generate Contentlayer types
        run: yarn contentlayer2 build

      - name: Lint
        run: yarn lint:check

      - name: Typecheck site
        run: yarn tsc --noEmit -p .

      - name: Typecheck API
        run: yarn workspace @andreluizv/api typecheck

      - name: Test API
        run: yarn api:test
